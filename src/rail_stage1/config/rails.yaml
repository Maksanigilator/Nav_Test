rail_finder:
  ros__parameters:
    enabled: false
    map_id: platform
    database_path: /datasets/rail_registry/rails_platform.json
    base_frame: base_footprint
    mask_topic: /rails/mask
    depth_topic: /camera/aligned_depth_to_color/image_raw
    camera_info_topic: /camera/color/camera_info
    min_mask_area_px: 1200
    pair_tolerance_sec: 0.08
    max_observation_age_sec: 1.0
    plane_mode: depth
    floor_z: 0.0
    plane_height_tolerance: 0.20
    plane_max_tilt_deg: 20.0
    plane_residual: 0.015
    plane_min_points: 80
    plane_min_fraction: 0.4
    max_range: 3.0
    feature_height: 0.04
    bev_resolution: 0.01
    bev_x_min: -0.2
    bev_x_max: 3.0
    bev_half_width: 1.5
    hough_votes: 20
    min_line_length: 0.25
    max_line_gap: 0.10
    line_support_band: 0.025
    max_candidates: 30
    rail_gauge: 0.526
    gauge_tolerance: 0.10
    parallel_tolerance_deg: 12.0
    perpendicular_tolerance_deg: 15.0
    corner_allowance: 0.22
    min_arm_extent: 0.30
    ambiguity_score_ratio: 0.90
    ambiguity_position: 0.20
    ambiguity_angle_deg: 15.0
    confirmation_frames: 5
    confirmation_timeout: 3.0
    confirmation_position: 0.12
    confirmation_angle_deg: 8.0
    match_distance: 0.55
    match_angle_deg: 20.0
    approach_distance: 0.90
rail_approach:
  ros__parameters:
    approach_distance: 0.90
    nav_action: /navigate_to_pose
    timeout_sec: 120.0
    registry_timeout_sec: 5.0
    motion_lock_path: /tmp/aida_nav_vlad_motion.lock
    base_frame: base_footprint
    xy_tolerance: 0.15
    yaw_tolerance_deg: 10.0
    pose_dwell_sec: 0.3
    pose_max_age_sec: 0.5
