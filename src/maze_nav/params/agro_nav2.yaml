# Nav2 для агроробота на стенде с рельсами.
#
# Отдельный файл, а не правка maze_params_rgbd.yaml: тот настроен под
# маленького робота в лабиринте (radius 0.22, скорость 0.26), и разница
# здесь не в числах, а в постановке.
#
# ГЛАВНОЕ ОТЛИЧИЕ — робот велик относительно площадки. По мешу шасси он
# 1.20 x 0.88 м, а настил 2 x 3 м. Описывать его окружностью нельзя: её
# радиус 0.75 м, и после раздувания на настиле не осталось бы ни одной
# свободной клетки под центр робота. Поэтому задан полигон, а критик
# стоимости считает именно по нему.
#
# Разворот на месте требует круга радиусом 0.75 м, то есть поперёк настила
# (2 м) центр робота может гулять лишь в полосе ±0.25 м. Это не настройка,
# а физика площадки: точку старта надо выбирать в середине.
#
# Карту и map->odom даёт RTAB-Map, поэтому ни AMCL, ни map_server здесь нет.

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: ['navigate_to_pose', 'navigate_through_poses']
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

controller_server:
  ros__parameters:
    controller_frequency: 15.0
    # Порог «робот считается стоящим». У меканума на рельсах реальная
    # скорость заметно ниже скомандованной, но подход к точке идёт по
    # настилу, там таких потерь нет.
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      # 60 с, а не 15: команда с Nav2 доходит до колёс только после того,
      # как на пульте нажат крестик (сторож момента на роботе,
      # require_safety_watchdog). Пока его не нажали, робот законно стоит,
      # и 15 с сторож не выдерживал -- Nav2 валил цель до начала движения.
      movement_time_allowance: 60.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.05
      # Курс на точке старта важен: с него начинается выверка перед
      # заездом, и чем меньше остаточная ошибка, тем меньше доворачивать.
      yaw_goal_tolerance: 0.05
      stateful: true

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 40
      model_dt: 0.0667
      batch_size: 1000
      # Меканум ездит боком, и это здесь не роскошь: на площадке 2 м
      # поперёк развернуться негде, а сместиться вбок можно всегда.
      motion_model: "Omni"
      # Разброс выборок траекторий. Держим пропорционально пределам:
      # с маленьким разбросом при больших пределах MPPI почти не
      # пробует быстрые варианты и всё равно ползёт.
      vx_std: 0.25
      vy_std: 0.25
      # Не больше wz_max: выборки за пределом всё равно обрежутся.
      wz_std: 0.22
      # Пределы подняты под ЖЕЛЕЗО. Геймпад на полном газе даёт 1.0 м/с
      # вперёд, 0.5 вбок и 0.5 рад/с поворота (см. scales в
      # docker_ros/ds4_twist/twist_aida.yaml у робота). Прежние 0.25 м/с
      # были вчетверо меньше, и на ковролине робот массой 120 кг просто
      # не трогался: трения покоя они не пересиливали.
      #
      # Назад заметно медленнее: там слепая зона камеры.
      # ПРЕДЕЛЫ СНИЖЕНЫ ВДВОЕ 6 октября 2026 после первого выезда по
      # Nav2: робот разгонялся и проскакивал цель. Прежние 0.7 / 0.5 / 0.5
      # достались от обкатки в симуляторе, где не было ни задержки связи,
      # ни края площадки.
      #
      # Считано: с 0.7 м/с при замедлении 1.0 м/с^2 тормозной путь 0.25 м,
      # плюс задержка Wi-Fi до робота (замерено 105-343 мс, в среднем 210)
      # даёт ещё около 0.15 м на полном ходу. Итого перелёт под 0.4 м даже
      # при безупречном управлении. После деления вдвое тормозной путь
      # падает вчетверо, до 0.06 м: он идёт как квадрат скорости.
      #
      # ЗАМЕДЛЕНИЕ НЕ ТРОГАЕМ. max_decel ниже оставлен прежним НАРОЧНО:
      # уменьшив его, мы удлинили бы тормозной путь — ровно то, с чем
      # боремся. Уменьшено только разрешённое ускорение.
      # ПОДНЯТО 9 октября 2026 до половины разницы с пультом. Пульт на
      # полном ходу даёт ровно пределы драйвера (twist_aida.yaml: 0.5 /
      # 0.5 / 0.24 — scales специально приравнены к max_linear_mps и
      # max_angular_rps). Берём середину между прежним пределом и ними:
      #   vx 0.35 + (0.5 - 0.35)/2 = 0.425
      #   vy 0.25 + (0.5 - 0.25)/2 = 0.375
      #   wz 0.20 + (0.24 - 0.20)/2 = 0.22
      # Чем это оплачено: на 0.425 м/с тормозной путь v^2/2a при
      # замедлении 1.0 даёт 0.09 м, плюс задержка связи 0.21 с — ещё
      # 0.09 м. Запас на перелёт растёт с 0.14 до 0.18 м. Терпимо
      # ровно потому, что ускорения прогноза теперь честные (ax_* ниже):
      # прежде MPPI вообще не знал, что тормозить надо заранее.
      vx_max: 0.425
      # Назад по-прежнему вдвое медленнее вперёд: там слепая зона камеры,
      # и это причина, не связанная с пультом.
      vx_min: -0.2125
      vy_max: 0.375
      # 0.20, а не 0.25: у драйвера робота max_angular_rps = 0.24
      # (odroid_driver.yaml), столько же стоит и на пульте.
      wz_max: 0.22
      # УСКОРЕНИЯ. Тормозные (ax_min, ay_min) взяты с робота честно:
      # max_linear_decel_mps2 = 1.0. На них держится весь расчёт перелёта,
      # и прежде их не было вовсе -- MPPI брал умолчание около 3 м/с^2 и
      # не знал, что тормозить надо заранее. Это и был источник
      # проскакивания цели.
      #
      # РАЗГОННЫЕ (ax_max, ay_max, az_max) НАРОЧНО ВЫШЕ, ЧЕМ У РОБОТА.
      # Соблазнительно поставить сюда рампу робота (0.175 м/с^2), но так
      # робот встаёт насмерть -- проверено 9 октября 2026, команда на
      # /cmd_nav_raw держалась около 0.01 м/с и дрожала знаком.
      #
      # Почему. Параметр делает ДВЕ работы разом: он и модель прогноза, и
      # предел на изменение команды относительно ИЗМЕРЕННОЙ скорости.
      # Первая команда выходит не выше, чем current + model_dt * ax_max,
      # то есть 0.0667 * 0.175 = 0.0117 м/с. Робот массой 120 кг на
      # сантиметре в секунду не трогается, одометрия остаётся нулём,
      # значит и следующая команда снова 0.0117. Замкнутый круг: трение
      # покоя в модели не описано, а выйти за него MPPI не разрешает сам
      # себе. С пульта этого не бывает -- там цель сразу 0.5 м/с, и рампа
      # робота разгоняется к ней сама.
      #
      # Рампу робот и так соблюдает у себя (motion_guard.ramp_cmd), так
      # что ограничивать её ещё и здесь не даёт ничего, кроме этого
      # залипания. Прогноз выходит оптимистичным по времени выхода на
      # скорость, но каждый такт пересчитывается от измеренной скорости и
      # сам себя правит; а то, от чего зависит перелёт -- торможение --
      # остаётся верным.
      #
      # Настоящее лечение трения покоя -- на роботе: либо поднять
      # max_linear_accel_mps2, либо задействовать torque_ff, который
      # сейчас 0.0 и заведён ровно для этого.
      ax_max: 2.0
      ax_min: -1.0
      ay_max: 2.0
      ay_min: -1.0
      az_max: 2.0
      iteration_count: 1
      prune_distance: 1.2
      transform_tolerance: 0.2
      temperature: 0.3
      gamma: 0.015
      visualize: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.0
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic",
                "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
                "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.0
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        # ПОДНЯТО с 2.0 до 8.0 9 октября 2026: на стенде робот уехал
        # задом там, где мог развернуться. Ход назад не запрещён -- он
        # лишь дороже, и MPPI возьмёт его, когда разворот обойдётся
        # дороже. Ориентир: PathAlignCritic весит 14, GoalCritic 5, так
        # что 8 заметно, но не подавляюще.
        #
        # Назад мешает ехать ещё и слепая зона: ближайшая земля в кадре
        # начинается в 7 см ПЕРЕД бампером, а сзади камера не видит
        # вовсе. Прежние 2.0 ставились из соображения, что у меканума
        # нет причины предпочитать ход вперёд -- по кинематике так и
        # есть, но по обзору причина как раз имеется.
        #
        # Вблизи цели критик отключается сам (threshold_to_consider),
        # так что подработать задом на последних полуметре он не мешает.
        cost_weight: 8.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        # ПО ПОЛИГОНУ, а не по окружности. С окружностью радиуса 0.75 м
        # контроллер не нашёл бы на настиле ни одной допустимой позы.
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      # Полигон корпуса: 1.20 x 0.88 м по мешу шасси, с запасом по 1 см.
      footprint: "[[0.61, 0.45], [0.61, -0.45], [-0.61, -0.45], [-0.61, 0.45]]"
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Раздувание маленькое намеренно. Робот описан полигоном, столкновения
        # ловит критик стоимости, а большое раздувание на площадке 2 м
        # закрасило бы её целиком.
        cost_scaling_factor: 3.0
        # Радиус раздувания чуть БОЛЬШЕ описанного (0.772 м по полигону
        # 1.22 x 0.90).
        #
        # Сначала я поставил сюда вписанный радиус 0.46, рассудив, что
        # описанный «закроет настил шириной 2 м целиком». Рассуждение было
        # неверным: раздувание задаёт лишь протяжённость градиента
        # стоимости, а НЕПРОХОДИМЫМИ клетки становятся в пределах
        # вписанного радиуса, и он берётся из полигона, а не отсюда.
        # То есть увеличение радиуса не отнимает у робота ни одной клетки.
        #
        # Зато при радиусе меньше описанного Nav2 на каждом такте сыпал
        # ошибкой computeCircumscribedCost: он не может срезать проверку
        # столкновений по полю стоимости и вынужден проверять весь полигон
        # всегда. Это и медленнее, и забивает журнал так, что настоящих
        # сообщений не видно.
        # 0.55 вместо прежних 0.78.
        #
        # Площадка около двух метров, робот 1.22 x 0.90 — он на ней едва
        # помещается. Раздувание 0.78 м шло от кромки по всему периметру и
        # не оставляло планировщику свободного места вовсе.
        #
        # Предел считается по КОЛЁСАМ, а не по кузову: падает робот тогда,
        # когда пятно контакта переходит кромку. По CAD колёса стоят на
        # 0.3554 м вдоль и 0.361 м поперёк от центра, значит в худшем
        # развороте, углом к краю, колесо повисает при 0.51 м. Отсюда и
        # 0.55 — запас четыре сантиметра.
        #
        # Жёсткий запрет при этом задаёт не раздувание, а ВПИСАННЫЙ радиус
        # 0.45 м (половина ширины кузова) плюс проверка габарита у MPPI
        # (consider_footprint). Последняя строже физического предела: она
        # не пускает на летальные клетки весь кузов, который выступает за
        # колёса. Раздувание же только отговаривает.
        #
        # Ниже 0.45 ставить бессмысленно: клетки внутри вписанного радиуса
        # летальны и так.
        inflation_radius: 0.55
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.61, 0.45], [0.61, -0.45], [-0.61, -0.45], [-0.61, 0.45]]"
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # 0.55 вместо прежних 0.78.
        #
        # Площадка около двух метров, робот 1.22 x 0.90 — он на ней едва
        # помещается. Раздувание 0.78 м шло от кромки по всему периметру и
        # не оставляло планировщику свободного места вовсе.
        #
        # Предел считается по КОЛЁСАМ, а не по кузову: падает робот тогда,
        # когда пятно контакта переходит кромку. По CAD колёса стоят на
        # 0.3554 м вдоль и 0.361 м поперёк от центра, значит в худшем
        # развороте, углом к краю, колесо повисает при 0.51 м. Отсюда и
        # 0.55 — запас четыре сантиметра.
        #
        # Жёсткий запрет при этом задаёт не раздувание, а ВПИСАННЫЙ радиус
        # 0.45 м (половина ширины кузова) плюс проверка габарита у MPPI
        # (consider_footprint). Последняя строже физического предела: она
        # не пускает на летальные клетки весь кузов, который выступает за
        # колёса. Раздувание же только отговаривает.
        #
        # Ниже 0.45 ставить бессмысленно: клетки внутри вписанного радиуса
        # летальны и так.
        inflation_radius: 0.55
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.10
      use_astar: true
      allow_unknown: false

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.1
    rotational_acc_lim: 0.5

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.425, 0.375, 0.22]
    min_velocity: [-0.2125, -0.375, -0.22]
    # Разгон НЕ приводим к рампе робота (0.175 м/с^2) намеренно: робот
    # ограничивает её у себя сам, а второй такой же ограничитель здесь
    # только добавил бы запаздывание -- и, как выяснилось, не давал
    # стронуться с места. Подробный разбор у ax_max выше.
    # Торможение прежнее и НАРОЧНО: уменьшив его, мы удлинили бы
    # тормозной путь. Угловое -2.0 мягче робота (4.5) -- так и оставляем.
    max_accel: [0.5, 0.5, 1.0]
    max_decel: [-1.0, -1.0, -2.0]
    odom_topic: "odom"
    odom_duration: 0.1

collision_monitor:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    # Монитор стоит ПОСЛЕДНИМ в цепочке скоростей и потому переименовывает
    # выход Nav2 в тот топик, который слушает робот. Так связка получается
    # без лишнего ретранслятора.
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    # Аварийная остановка по обрыву: точки края уже подделаны под обычное
    # препятствие и лежат в облаке детектора, так что монитор видит край
    # тем же способом, что и всё остальное.
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: false
      enabled: true
    observation_sources: ["dropoff"]
    dropoff:
      type: "pointcloud"
      topic: "/dropoff/grid_cloud"
      min_height: 0.10
      max_height: 0.60
      enabled: true

# Стыковка с зарядной станцией нам не нужна, но navigation_launch.py
# поднимает docking_server всегда и без плагина валит весь запуск целиком
# («Charging dock plugins not given» -> «Failed to bring up all requested
# nodes»). Поэтому даём ему штатный плагин и пустой список станций.
docking_server:
  ros__parameters:
    controller_frequency: 10.0
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      use_battery_status: false
      use_external_detection_pose: false
    # Пустой список YAML отдаёт как «значение не задано», и узел падает с
    # InvalidParameterValueException. Поэтому одна фиктивная станция.
    docks: ['dummy_dock']
    dummy_dock:
      type: 'simple_charging_dock'
      frame: 'map'
      pose: [0.0, 0.0, 0.0]
    base_frame: "base_footprint"
    fixed_frame: "odom"

# Менеджер жизненного цикла: запас по времени на подъём.
#
# Значения по умолчанию рассчитаны на готовую систему, а здесь Nav2
# поднимается рядом с Gazebo и RTAB-Map. Даже с отложенным стартом сервер
# может ответить не сразу, и короткий срок связи роняет весь подъём.
lifecycle_manager_navigation:
  ros__parameters:
    autostart: true
    bond_timeout: 20.0
    attempt_respawn_reconnection: true
    bond_respawn_max_duration: 30.0
