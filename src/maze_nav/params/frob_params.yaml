# Nav2 для РЕАЛЬНОГО робота Frob (репозиторий dark516/Frob_robot).
#
# Отличия от maze_params*.yaml (те — под TurtleBot3 в Gazebo):
#   * use_sim_time везде False: /clock никто не публикует, время системное;
#   * базовый фрейм base_footprint, а не base_link — у Frob фрейма base_link
#     нет вовсе, цепочка URDF такая: base_footprint -> robot_base -> lidar -> laser;
#   * одометрия берётся с /odometry/filtered (выход EKF robot_localization
#     на самом роботе), а не с сырого /odom;
#   * геометрия и лимиты из URDF робота и ros2_arduino_bridge:
#     корпус — цилиндр R=0.11 м, база колёс 0.18 м,
#     потолок моста MAX_LIN_SPEED 0.4863 м/с и MAX_ANG_SPEED 5.4 рад/с;
#   * /cmd_vel остаётся geometry_msgs/Twist (enable_stamped_cmd_vel не трогаем):
#     ровно это слушает arduino_bridge.
#
# Робот должен быть поднят своим bringup: ros2 launch frob_bringup bringup.launch.py

amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    global_frame_id: "map"
    odom_frame_id: "odom"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    # Лидар добивает до 16 м, но в помещении дальние лучи только шумят
    laser_max_range: 12.0
    laser_min_range: 0.15
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    # Робот мелкий и медленный — обновляемся чаще, чем дефолтные 0.25 м
    update_min_a: 0.1
    update_min_d: 0.05
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    # Только отфильтрованный скан: в сыром больше сотни лучей упираются
    # в собственный корпус робота (цилиндр R=0.11 при лидаре на 0.07 впереди),
    # и AMCL принимает их за стену, которая едет вместе с роботом
    scan_topic: /scan/filtered

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # plugin_lib_names в Jazzy не нужен: встроенные BT-узлы грузятся сами

controller_server:
  ros__parameters:
    use_sim_time: False
    # Лидар даёт 10 Гц, костмапы обновляются на 5 — быстрее считать смысла нет
    controller_frequency: 5.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: /odometry/filtered
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.35

    FollowPath:
      # Rotation Shim: сначала развернуться на месте, потом ехать. Для
      # дифференциального привода в тесных местах это заметно лучше DWB,
      # который умеет только дуги постоянной кривизны.
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      angular_dist_threshold: 0.5
      forward_sampling_distance: 0.4
      rotate_to_heading_angular_vel: 0.8
      max_angular_accel: 2.0
      simulate_ahead_time: 1.0

      # --- Regulated Pure Pursuit ---
      # Мост клампит на 0.4863 м/с и 5.4 рад/с; берём с большим запасом,
      # первый выезд должен быть медленным.
      desired_linear_vel: 0.25
      lookahead_dist: 0.5
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.7
      lookahead_time: 1.5
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.5
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.4
      regulated_linear_scaling_min_speed: 0.1
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      allow_reversing: false
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False
      update_frequency: 5.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 2
      height: 2
      resolution: 0.05
      # НАМЕРЕННО ЗАНИЖЕН. Реальный корпус — цилиндр R=0.11 м, но при честном
      # радиусе робот не пролезал между объектами: планировщик не находил пути,
      # а spin и backup срывались с "Collision Ahead". Робот считает себя почти
      # точкой, поэтому физического запаса до препятствий больше нет —
      # значение для отладки, не для постоянной работы.
      robot_radius: 0.06
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          # Отфильтрованный скан: lidar_filter вырезает лучи, упирающиеся
          # в сам корпус, иначе робот видит препятствие вокруг себя
          topic: /scan/filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          # 0.0, а не порог: корпус из скана убирает lidar_filter на роботе
          # (геометрически, по расстоянию от base_footprint), и делает это
          # штатно. Порог по дальности здесь только ослепил бы робота у
          # близких стен, а raytrace всё равно стирал бы их из костмапы.
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 0.06
      # False: по сети уходят только изменившиеся клетки, а не вся
      # карта каждый цикл. При забитом Wi-Fi разница решающая —
      # сканы начинали опаздывать на 2-3 секунды, и collision_monitor
      # отбрасывал их как устаревшие.
      always_send_full_costmap: False

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: False
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      robot_radius: 0.06
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan/filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          # 0.0, а не порог: корпус из скана убирает lidar_filter на роботе
          # (геометрически, по расстоянию от base_footprint), и делает это
          # штатно. Порог по дальности здесь только ослепил бы робота у
          # близких стен, а raytrace всё равно стирал бы их из костмапы.
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 0.06
      # False: по сети уходят только изменившиеся клетки, а не вся
      # карта каждый цикл. При забитом Wi-Fi разница решающая —
      # сканы начинали опаздывать на 2-3 секунды, и collision_monitor
      # отбрасывал их как устаревшие.
      always_send_full_costmap: False

map_server:
  ros__parameters:
    use_sim_time: False
    # Подставляется аргументом map:= из launch-файла
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    use_sim_time: False
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.3
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: False
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.4
    rotational_acc_lim: 2.0

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # Потолок моста — 0.4863 м/с и 5.4 рад/с, держимся заметно ниже
    max_velocity: [0.35, 0.0, 1.5]
    min_velocity: [-0.35, 0.0, -1.5]
    max_accel: [0.5, 0.0, 2.0]
    max_decel: [-0.5, 0.0, -2.0]
    odom_topic: /odometry/filtered
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
    cmd_vel_out_topic: "cmd_vel_smoothed"

collision_monitor:
  ros__parameters:
    use_sim_time: False
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    # Последнее звено цепочки: именно отсюда Twist уходит на arduino_bridge.
    # controller_server -> cmd_vel_nav -> velocity_smoother -> cmd_vel_smoothed -> сюда
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.5
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: /scan/filtered
      min_height: 0.15
      max_height: 2.0
      enabled: True

docking_server:
  ros__parameters:
    use_sim_time: False
    # Стыковкой не пользуемся, но нода входит в bringup Jazzy и без
    # секции параметров лишь зря греет lifecycle-менеджер
    controller_frequency: 10.0
    base_frame: "base_footprint"
    fixed_frame: "odom"
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      use_battery_status: false
      use_stall_detection: false

slam_toolbox:
  ros__parameters:
    use_sim_time: False
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    # То же, что и у AMCL: корпус в скане ломает сшивку сканов
    scan_topic: /scan/filtered
    mode: mapping
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 2.0
    resolution: 0.05
    max_laser_range: 12.0
    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true
    use_scan_matching: true
    use_scan_barycenter: true
    # Снижено с 0.2: скан попадает в граф после 10 см или ~6° вместо 20 см
    # и 11°. Стенам это безразлично, а объект в центре комнаты, который виден
    # лишь несколько секунд за заезд, набирает вдвое больше наблюдений.
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 12.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45
    # НЕ УВЕЛИЧИВАТЬ без пересчёта resolution/smear_deviation: при 0.65
    # slam_toolbox падал с "Mapper FATAL ERROR - unable to get pointer
    # in probability search" — индекс выходил за корреляционную сетку.
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
