# Скорости навигации и заезда — одно место на всё.
#
# robot_nav.launch.py читает этот файл при старте и раскладывает значения:
# секцию nav2 — в agro_nav2.yaml (MPPI, сглаживатель, разворот), секцию
# rail_server — в параметры сервера рельсов. Другой файл задаётся так:
#     ros2 launch maze_nav robot_nav.launch.py speeds:=/путь/к/файлу.yaml
# Правка вступает в силу после перезапуска launch.
#
# Пульт и общий потолок привода живут на роботе, не здесь:
# aida_bot_ws/docker_ros/ds4_twist/twist_aida.yaml (scales) и
# aida_bot_ws/src/odroid_node/config/odroid_driver.yaml
# (max_linear_mps 0.5, max_angular_rps 0.24). Выше потолка привода
# числа здесь ставить бессмысленно — он всё равно обрежет.
#
# НИЖЕ ОПРЕДЕЛЁННОГО ПРЕДЕЛА НЕ ОПУСКАТЬ. Робот 120 кг и на малой команде
# может не стронуться с места: трение покоя Nav2 не моделирует (разбор у
# ax_max в agro_nav2.yaml). Если на ПОДХОДЕ команда есть, а робот стоит,
# первым делом поднять vx_max и vy_max.

# Nav2: м/с и рад/с. Прежние значения — 0.425 / -0.2125 / 0.375 / 0.22.
nav2:
  vx_max: 0.20
  # Назад медленнее вперёд: там слепая зона камеры.
  vx_min: -0.10
  vy_max: 0.18
  wz_max: 0.12

# Сервер рельсов. Прежние значения — в скобках.
rail_server:
  # Поворот на месте в фазе ОСМОТР, рад/с (0.30).
  scan_rate: 0.15
  # Ход по рельсам: ЗАЕЗД, ОТКАТ и СЪЕЗД, м/с (0.12).
  drive_speed: 0.10
  # ВЫВЕРКА на оси: боковая скорость и поворот, м/с и рад/с (0.08, 0.25).
  align_max_vy: 0.05
  align_max_wz: 0.12
  # Подруливание по оси на ОТКАТЕ и СЪЕЗДЕ (0.06, 0.20).
  track_max_vy: 0.04
  track_max_wz: 0.12
